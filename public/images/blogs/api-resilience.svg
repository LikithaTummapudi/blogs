<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgResilience" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A241F" />
      <stop offset="100%" stop-color="#121815" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DA487" />
      <stop offset="100%" stop-color="#3D6B56" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgResilience)" />

  <!-- Technical Circuit Grid Lines -->
  <g stroke="#26352D" stroke-width="1" opacity="0.6">
    <circle cx="400" cy="225" r="160" fill="none" stroke-dasharray="6 6"/>
    <circle cx="400" cy="225" r="210" fill="none" stroke-dasharray="3 3"/>
  </g>

  <!-- Flow Nodes: Client -> Gateway / Idempotency Cache -> Circuit Breaker -> Microservice -->
  <g transform="translate(100, 165)">
    <!-- Client Node -->
    <rect x="0" y="20" width="100" height="80" rx="8" fill="#1C2922" stroke="#3D6B56" stroke-width="2" />
    <text x="50" y="55" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">CLIENT</text>
    <text x="50" y="75" fill="#7DA487" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Idempotent-Key</text>

    <!-- Arrow to Gateway -->
    <path d="M 100 60 L 170 60" fill="none" stroke="#7DA487" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Gateway Node -->
    <rect x="180" y="10" width="120" height="100" rx="8" fill="#1C2922" stroke="#568462" stroke-width="2" />
    <text x="240" y="45" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">GATEWAY</text>
    <rect x="195" y="60" width="90" height="24" rx="4" fill="#2E5040" />
    <text x="240" y="76" fill="#CFDDD3" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Redis Token Bucket</text>

    <!-- Arrow to Circuit Breaker -->
    <path d="M 300 60 L 370 60" fill="none" stroke="#7DA487" stroke-width="2" />

    <!-- Circuit Breaker Ring / States -->
    <g transform="translate(420, 60)">
      <circle cx="0" cy="0" r="42" fill="#18251E" stroke="#7DA487" stroke-width="2"/>
      <path d="M -20 -10 L 0 10 L 20 -10" fill="none" stroke="#E6EEE9" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="22" fill="#7DA487" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">CLOSED</text>
    </g>

    <!-- Arrow to Upstream Service -->
    <path d="M 470 60 L 530 60" fill="none" stroke="#7DA487" stroke-width="2" />

    <!-- Backend Service -->
    <rect x="540" y="20" width="100" height="80" rx="8" fill="#1C2922" stroke="#3D6B56" stroke-width="2" />
    <text x="590" y="55" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">SERVICE</text>
    <text x="590" y="75" fill="#7DA487" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">HTTP 200 OK</text>
  </g>

  <!-- Title Badge overlay -->
  <rect x="520" y="370" width="230" height="36" rx="18" fill="#121815" stroke="#26352D" stroke-width="1.5" />
  <circle cx="538" cy="388" r="4" fill="#7DA487" />
  <text x="552" y="393" fill="#CFDDD3" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">SYSTEM RESILIENCE PATTERNS</text>
</svg>
