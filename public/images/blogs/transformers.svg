<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282624" />
      <stop offset="100%" stop-color="#1A1918" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE8B72" />
      <stop offset="100%" stop-color="#C2593F" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC386" />
      <stop offset="100%" stop-color="#B86C25" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g stroke="#3D3A37" stroke-width="0.75" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="560" y1="0" x2="560" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />

    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Attention Matrix Heatmap Motif -->
  <g transform="translate(140, 100)">
    <!-- Query Key Value Vectors -->
    <rect x="0" y="0" width="30" height="240" rx="4" fill="#3D3A37" />
    <text x="15" y="-15" fill="#C8B79D" font-family="'Newsreader', Georgia, serif" font-size="14" text-anchor="middle">Q</text>
    <rect x="45" y="0" width="30" height="240" rx="4" fill="#5A554F" />
    <text x="60" y="-15" fill="#C8B79D" font-family="'Newsreader', Georgia, serif" font-size="14" text-anchor="middle">K</text>
    <rect x="90" y="0" width="30" height="240" rx="4" fill="url(#terracotta)" />
    <text x="105" y="-15" fill="#DE8B72" font-family="'Newsreader', Georgia, serif" font-size="14" text-anchor="middle">V</text>

    <!-- Multi-head Attention Connection Arcs -->
    <path d="M 120 40 C 200 40, 240 70, 280 120" fill="none" stroke="#DE8B72" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <path d="M 120 120 C 200 120, 220 120, 280 120" fill="none" stroke="#C2593F" stroke-width="3" opacity="0.9"/>
    <path d="M 120 200 C 200 200, 240 170, 280 120" fill="none" stroke="#ECC386" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Scaled Dot-Product Core Node -->
    <circle cx="280" cy="120" r="32" fill="#1A1918" stroke="url(#terracotta)" stroke-width="3"/>
    <text x="280" y="125" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">softmax</text>

    <!-- Matrix Output Grid -->
    <g transform="translate(360, 40)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#DE8B72" opacity="0.95" />
      <rect x="38" y="0" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.5" />
      <rect x="76" y="0" width="32" height="32" rx="4" fill="#C2593F" opacity="0.8" />
      <rect x="114" y="0" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.3" />

      <!-- Row 2 -->
      <rect x="0" y="38" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.4" />
      <rect x="38" y="38" width="32" height="32" rx="4" fill="#ECC386" opacity="0.9" />
      <rect x="76" y="38" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.6" />
      <rect x="114" y="38" width="32" height="32" rx="4" fill="#DE8B72" opacity="0.75" />

      <!-- Row 3 -->
      <rect x="0" y="76" width="32" height="32" rx="4" fill="#C2593F" opacity="0.85" />
      <rect x="38" y="76" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.4" />
      <rect x="76" y="76" width="32" height="32" rx="4" fill="#DE8B72" opacity="0.9" />
      <rect x="114" y="76" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.5" />

      <!-- Row 4 -->
      <rect x="0" y="114" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.3" />
      <rect x="38" y="114" width="32" height="32" rx="4" fill="#DE8B72" opacity="0.6" />
      <rect x="76" y="114" width="32" height="32" rx="4" fill="#3D3A37" opacity="0.5" />
      <rect x="114" y="114" width="32" height="32" rx="4" fill="#ECC386" opacity="0.95" />

      <text x="73" y="175" fill="#C8B79D" font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic" text-anchor="middle">Attention Weight Heatmap</text>
    </g>
  </g>

  <!-- Title Badge overlay in corner -->
  <rect x="520" y="370" width="230" height="36" rx="18" fill="#1A1918" stroke="#3D3A37" stroke-width="1.5" />
  <circle cx="538" cy="388" r="4" fill="#C2593F" />
  <text x="552" y="393" fill="#DFD3C0" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">ATTENTION IS ALL YOU NEED</text>
</svg>
