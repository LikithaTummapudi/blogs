<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211A15" />
      <stop offset="100%" stop-color="#14100D" />
    </linearGradient>
    <linearGradient id="amberRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC386" />
      <stop offset="100%" stop-color="#DF9F4C" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgRust)" />

  <!-- Memory Visualization: Stack vs Heap -->
  <g transform="translate(120, 90)">
    <!-- Stack Section -->
    <rect x="0" y="0" width="220" height="260" rx="6" fill="#1B1511" stroke="#DF9F4C" stroke-width="1.5" />
    <text x="110" y="32" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">THE STACK (Fast, LIFO)</text>
    <line x1="15" y1="46" x2="205" y2="46" stroke="#423328" stroke-width="1" />

    <!-- Stack Frames -->
    <rect x="15" y="60" width="190" height="40" rx="4" fill="#2E231B" stroke="#DF9F4C" stroke-width="1" />
    <text x="25" y="85" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="11">ptr: 0x7ffd9a</text>
    <text x="180" y="85" fill="#DF9F4C" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">8 B</text>

    <rect x="15" y="110" width="190" height="40" rx="4" fill="#2E231B" stroke="#DF9F4C" stroke-width="1" />
    <text x="25" y="135" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="11">len: 5, cap: 8</text>
    <text x="180" y="135" fill="#DF9F4C" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">16 B</text>

    <rect x="15" y="160" width="190" height="75" rx="4" fill="#3D2E24" stroke="#B86C25" stroke-dasharray="3 3" />
    <text x="110" y="195" fill="#ECC386" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Owner: let mut buffer</text>
    <text x="110" y="215" fill="#C8B79D" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Lifetime: 'a</text>

    <!-- Pointer Arrow from Stack to Heap -->
    <path d="M 205 80 C 270 80, 270 140, 335 140" fill="none" stroke="#ECC386" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="340,140 330,135 330,145" fill="#ECC386" />

    <!-- Heap Section -->
    <rect x="345" y="0" width="220" height="260" rx="6" fill="#1B1511" stroke="#DE8B72" stroke-width="1.5" />
    <text x="455" y="32" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">THE HEAP (Dynamic)</text>
    <line x1="360" y1="46" x2="550" y2="46" stroke="#423328" stroke-width="1" />

    <g transform="translate(360, 65)">
      <rect x="0" y="0" width="36" height="45" rx="3" fill="#C2593F" opacity="0.9"/>
      <text x="18" y="28" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">'H'</text>

      <rect x="40" y="0" width="36" height="45" rx="3" fill="#C2593F" opacity="0.9"/>
      <text x="58" y="28" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">'E'</text>

      <rect x="80" y="0" width="36" height="45" rx="3" fill="#C2593F" opacity="0.9"/>
      <text x="98" y="28" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">'L'</text>

      <rect x="120" y="0" width="36" height="45" rx="3" fill="#C2593F" opacity="0.9"/>
      <text x="138" y="28" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">'L'</text>

      <rect x="160" y="0" width="36" height="45" rx="3" fill="#C2593F" opacity="0.9"/>
      <text x="178" y="28" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">'O'</text>

      <rect x="0" y="60" width="196" height="110" rx="4" fill="#2E231B" stroke="#736E67" stroke-width="1" stroke-dasharray="2 2" />
      <text x="98" y="95" fill="#FAF7F2" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Zero-Cost Abstractions</text>
      <text x="98" y="115" fill="#DF9F4C" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">No Garbage Collector</text>
      <text x="98" y="135" fill="#DE8B72" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Compile-Time Drop Check</text>
    </g>
  </g>

  <!-- Title Badge overlay -->
  <rect x="520" y="370" width="230" height="36" rx="18" fill="#14100D" stroke="#423328" stroke-width="1.5" />
  <circle cx="538" cy="388" r="4" fill="#DF9F4C" />
  <text x="552" y="393" fill="#FAEFDD" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">SYSTEMS RETROSPECTIVE</text>
</svg>
